<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Montserrat:wght@200;300;400&amp;display=swap');
      .serif { font-family: 'Cinzel', serif; fill: #FFFFFF; font-weight: 500; font-size: 36px; letter-spacing: 4px; }
      .sans { font-family: 'Montserrat', sans-serif; fill: #DBC18C; font-weight: 300; font-size: 36px; letter-spacing: 12px; }
      .tagline { font-family: 'Montserrat', sans-serif; fill: #CCCCCC; font-weight: 300; font-size: 9px; letter-spacing: 7px; text-transform: uppercase; }
      .icon-stroke { stroke: #DBC18C; stroke-width: 1; fill: none; }
      .icon-stroke-thick { stroke: #FFFFFF; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  
  <g transform="translate(150, 70)">
    <g transform="translate(0, -35)">
      <circle cx="0" cy="0" r="18" class="icon-stroke" stroke-width="0.5" opacity="0.8"/>
      <circle cx="0" cy="0" r="14" class="icon-stroke" stroke-width="1.2"/>
      
      <path d="M -3 -6 L -3 8" class="icon-stroke-thick" />
      <path d="M -3 -6 C 4 -6, 6 -3, 6 0 C 6 3, 4 5, -3 5" class="icon-stroke" stroke-width="1.5" />
      
      <path d="M 4 -1 L 5.5 -2.5 L 7 -1 L 5.5 0.5 Z" fill="#DBC18C" />
    </g>

    <text x="-4" y="30" text-anchor="end" class="serif">PLAN</text>
    <text x="4" y="30" text-anchor="start" class="sans">IT</text>
    
    <line x1="-50" y1="45" x2="50" y2="45" class="icon-stroke" stroke-width="0.5" opacity="0.6"/>
    
    <text x="0" y="60" text-anchor="middle" class="tagline">EXCLUSIVE EVENTS</text>
  </g>
</svg>
