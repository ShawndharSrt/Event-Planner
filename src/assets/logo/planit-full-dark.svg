<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 160" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&amp;family=Montserrat:wght@200;300;400&amp;display=swap');
      .serif { font-family: 'Cinzel', serif; fill: #1A1A1A; font-weight: 500; font-size: 36px; letter-spacing: 4px; }
      .sans { font-family: 'Montserrat', sans-serif; fill: #B9862B; font-weight: 300; font-size: 36px; letter-spacing: 12px; }
      .tagline { font-family: 'Montserrat', sans-serif; fill: #666666; font-weight: 300; font-size: 9px; letter-spacing: 7px; text-transform: uppercase; }
      .icon-stroke { stroke: #B9862B; stroke-width: 1; fill: none; }
      .icon-stroke-thick { stroke: #1A1A1A; stroke-width: 1.5; fill: none; }
    </style>
  </defs>
  
  <!-- Centered Composition -->
  <g transform="translate(150, 70)">
    <!-- Elegant Minimalist Icon -->
    <g transform="translate(0, -35)">
      <!-- Outer thin rings -->
      <circle cx="0" cy="0" r="18" class="icon-stroke" stroke-width="0.5" opacity="0.6"/>
      <circle cx="0" cy="0" r="14" class="icon-stroke" stroke-width="1.2"/>
      
      <!-- Interlocking geometry for 'P' and 'I' -->
      <!-- 'P' baseline and curve -->
      <path d="M -3 -6 L -3 8" class="icon-stroke-thick" />
      <path d="M -3 -6 C 4 -6, 6 -3, 6 0 C 6 3, 4 5, -3 5" class="icon-stroke" stroke-width="1.5" />
      
      <!-- 'I' accent symbol (A little diamond) -->
      <path d="M 4 -1 L 5.5 -2.5 L 7 -1 L 5.5 0.5 Z" fill="#B9862B" />
    </g>

    <!-- Main Typographic Mark -->
    <text x="-4" y="30" text-anchor="end" class="serif">PLAN</text>
    <text x="4" y="30" text-anchor="start" class="sans">IT</text>
    
    <!-- Thin Dividing Line -->
    <line x1="-50" y1="45" x2="50" y2="45" class="icon-stroke" stroke-width="0.5" opacity="0.5"/>
    
    <!-- Tagline -->
    <text x="0" y="60" text-anchor="middle" class="tagline">EXCLUSIVE EVENTS</text>
  </g>
</svg>
