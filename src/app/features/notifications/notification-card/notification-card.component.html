<div class="notification-card-wrapper" [class.unread]="!notification.read">
    <!-- Icon Container -->
    <div class="icon-container" [ngClass]="'severity-' + notification.severity.toLowerCase()">
        <mat-icon>{{ getIcon() }}</mat-icon>
    </div>

    <!-- Content Body -->
    <div class="card-content">
        <h4 class="card-title">{{ notification.code.replace('_', ' ') | titlecase }}</h4>
        <div class="card-subtitle-row">
            <span class="card-message" [innerHTML]="notification.message"></span>
            @if (notification.eventId) {
            <span class="tag-badge">Event {{ notification.eventId.slice(-4) }}</span>
            }
        </div>
    </div>

    <!-- Right Actions -->
    <div class="right-actions">
        <span class="time">{{ notification.createdAt | date:'shortTime' }}</span>
        <button class="btn-action" (click)="onMarkCheck($event)">
            {{ notification.severity === 'CRITICAL' ? 'Review' : 'View' }}
        </button>
        <button mat-icon-button class="btn-menu" (click)="$event.stopPropagation()">
            <mat-icon>more_vert</mat-icon>
        </button>
    </div>
</div>
