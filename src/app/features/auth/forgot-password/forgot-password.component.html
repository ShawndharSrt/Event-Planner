<div class="auth-wrapper">
    <!-- Background Image -->
    <div class="auth-background"></div>

    <!-- Main Content -->
    <div class="auth-card-container">

        <!-- Welcome Text -->
        <div class="auth-welcome">
            <h1>Event Planner</h1>
            <p>Design your perfect moments.</p>
        </div>

        <!-- Forgot Password Card -->
        <div class="login-card glass-panel">
            <div class="card-header">
                <h2>Forgot Password?</h2>
                <p *ngIf="!isSubmitted">Enter your email to receive a reset link.</p>
                <p *ngIf="isSubmitted">Check your email for the reset link.</p>
            </div>

            <div *ngIf="isSubmitted" class="success-message">
                <span class="material-icons success-icon">check_circle</span>
                <p>We have sent a password reset link to <strong>{{ form.get('email')?.value }}</strong></p>
                <div class="form-actions center" style="margin-top: 2rem; text-align: center;">
                    <a routerLink="/login" class="back-to-login" style="color: white; text-decoration: underline;">Back
                        to Sign In</a>
                </div>
            </div>

            <form *ngIf="!isSubmitted" [formGroup]="form" (ngSubmit)="onSubmit()">
                <!-- Email -->
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrapper">
                        <span class="material-icons input-icon">email</span>
                        <input type="email" id="email" formControlName="email" placeholder="example@domain.com"
                            [class.error]="form.get('email')?.invalid && form.get('email')?.touched">
                    </div>
                </div>

                <button type="submit" class="btn-castella" [disabled]="form.invalid || isLoading">
                    <span *ngIf="!isLoading">Send Reset Link</span>
                    <span *ngIf="isLoading" class="spinner"></span>
                </button>

                <div class="card-footer">
                    <p>Remember your password? <a routerLink="/login">Sign In</a></p>
                </div>
            </form>
        </div>
    </div>
</div>
